    buyout-lore:
      - '<!italic><gray>Aukce okamžitě skončí'

bid:
  success: '<prefix> <green>Máš nejvyšší příhoz na <white><amount>x <item></white>: <gold><bid></gold>. Aukce č. <id> končí za <white><time></white>.'
  too-low: '<prefix> <red>Příhoz je příliš nízký. Minimum je <gold><next></gold>.'
  too-high: '<prefix> <red>Maximální cena je <gold><max></gold>.'
  own-listing: '<prefix> <red>Na vlastní aukci přihazovat nemůžeš.'
  already-highest: '<prefix> <yellow>V této aukci už máš nejvyšší příhoz.'
  not-available: '<prefix> <red>Tato aukce není dostupná (skončila, prodala se nebo byla zrušena).'
  insufficient-funds: '<prefix> <red>Na <gold><bid></gold> nemáš dost peněz.'
  payment-failed: '<prefix> <red>Platba selhala. Nic ti nebylo strženo.'
  outbid-race: '<prefix> <yellow>Někdo přihodil ve stejnou chvíli (nebo aukce právě skončila). Nic ti nebylo strženo; zkus to znovu.'
  no-buyout: '<prefix> <red>Tato aukce nemá cenu pro okamžitý nákup.'
  blocked: '<prefix> <red>Jiný plugin tento příhoz zablokoval.'
  not-an-auction: '<prefix> <red>Nabídka č. <id> není aukce. Kup ji v aukční síni.'
  usage: '<prefix> <red>Použití: <white>/ja bid <id> <částka></white>'
  outbid: '<prefix> <yellow>Někdo tě přehodil na <white><amount>x <item></white> (aukce č. <id>). <gold><old></gold> ti bylo vráceno. Nový nejvyšší příhoz: <gold><bid></gold>.'
  new-bid: '<prefix> <green><bidder> přihodil <gold><bid></gold> na tvůj <white><amount>x <item></white> (aukce č. <id>).'
  won: '<prefix> <green>Vyhrál jsi <white><amount>x <item></white> za <gold><price></gold>!'
  won-to-claim: '<prefix> <yellow>Máš plný inventář. Předmět na tebe čeká: <white>/ja claim</white>.'
  sold: '<prefix> <green>Tvoje aukce č. <id> skončila: <buyer> vyhrál <white><amount>x <item></white> za <gold><price></gold>. Dostal jsi <gold><earned></gold> (poplatek <fee>).'
  settle-failed: '<prefix> <red>Aukci č. <id> se nepodařilo vyplatit, proto byla zrušena. Vítěz dostal peníze zpět a předmět čeká v <white>/ja claim</white>.'
  winner-refunded: '<prefix> <yellow>Aukci č. <id> nešlo dokončit, proto ti byl příhoz <gold><bid></gold> vrácen.'
  removed-refund: '<prefix> <yellow>Admin odstranil aukci č. <id>. Tvůj příhoz <gold><bid></gold> ti byl vrácen.'

broadcast:
  listed: '<prefix> <yellow><player></yellow> prodává <white><amount>x <item></white> za <gold><price></gold>. <aqua>/ah</aqua>'
  sold: '<prefix> <yellow><buyer></yellow> koupil <white><amount>x <item></white> od <yellow><seller></yellow> za <gold><price></gold>.'
  auction-started: '<prefix> <yellow><player></yellow> zahájil aukci: <white><amount>x <item></white>, příhozy od <gold><price></gold>. <aqua>/ah</aqua>'
  auction-bid: '<prefix> <yellow><bidder></yellow> přihodil <gold><bid></gold> na <white><amount>x <item></white> (aukce č. <id>).'
  auction-won: '<prefix> <yellow><winner></yellow> vyhrál <white><amount>x <item></white> od <yellow><seller></yellow> za <gold><price></gold>.'
