name: JustAuction
version: '${version}'
main: me.skerik.justauction.JustAuctionPlugin
loader: me.skerik.justauction.JustAuctionLoader
api-version: '${apiVersion}'
description: Auction house with a GUI marketplace. Economy via Vault.
authors: [filasik]
website: https://github.com/filasik/JustAuction
folia-supported: false
dependencies:
  server:
    Vault:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  justauction.use:
    description: Browse and buy on the auction house
    default: true
  justauction.sell:
    description: List items for sale
    default: true
  justauction.bypass.limit:
    description: Ignore the per-player listing limit
    default: false
  justauction.admin:
    description: Reload, remove listings, update notifications
    default: op
