# JustAuction messages (MiniMessage). Missing keys fall back to the built-in English text.
# Placeholders in <angle brackets> are filled in by the plugin; keep them.
prefix: '<dark_gray>[<gold>Auction<dark_gray>]<reset>'

error:
  not-ready: '<prefix> <red>The auction house is still starting up. Try again in a moment.'
  players-only: '<prefix> <red>This command can only be used by players.'
  no-permission: '<prefix> <red>You do not have permission to do that.'
  generic: '<prefix> <red>Something went wrong. Nothing was lost; please try again or tell an admin.'

time:
  expired: 'expired'
  days: '{n}d'
  hours: '{n}h'
  minutes: '{n}m'
  seconds: '{n}s'

sell:
  invalid-price: '<prefix> <red>"<input>" is not a valid price. Example: <white>/ja sell 1500</white>, <white>2.5k</white> or <white>1.2m</white>.'
  no-item: '<prefix> <red>Hold the item you want to sell in your main hand.'
  blacklisted: '<prefix> <red>This item cannot be sold on the auction house (<material>).'
  success: '<prefix> <green>Listed <white><amount>x <item></white> for <gold><price></gold> (listing #<id>). You receive <gold><net></gold> after the <percent>% fee. It stays up for <white><time></white>.'
  price-too-low: '<prefix> <red>The minimum price is <gold><min></gold>.'
  price-too-high: '<prefix> <red>The maximum price is <gold><max></gold>.'
  limit-reached: '<prefix> <red>You already have the maximum of <white><limit></white> active listings.'
  cannot-afford-fee: '<prefix> <red>You need <gold><fee></gold> to create a listing.'
  item-gone: '<prefix> <red>The item left your hand before it could be listed. Nothing was charged.'
  busy: '<prefix> <red>Your previous listing is still being processed.'
  error: '<prefix> <red>The listing could not be saved. Your item and money were returned.'
  sold: '<prefix> <green><buyer> bought <white><amount>x <item></white> for <gold><price></gold>. You received <gold><earned></gold> (fee <fee>).'

  auction-started: '<prefix> <green>Auction #<id> started: <white><amount>x <item></white>, bids from <gold><price></gold>. Buyout: <buyout>. Ends in <white><time></white>. You receive the top bid minus the <percent>% fee.'
  auctions-disabled: '<prefix> <red>Auctions are switched off on this server.'
  bad-buyout: '<prefix> <red>The buyout price must be higher than the starting price (and not above <gold><max></gold>).'
  blocked: '<prefix> <red>Another plugin prevented this listing.'
  no-buyout: 'none'

buy:
  success: '<prefix> <green>You bought <white><amount>x <item></white> for <gold><price></gold>.'
  to-claim: '<prefix> <yellow>Your inventory is full. The item is waiting for you: <white>/ja claim</white>.'
  not-available: '<prefix> <red>That listing is no longer available.'
  own-listing: '<prefix> <red>You cannot buy your own listing.'
  insufficient-funds: '<prefix> <red>You cannot afford <gold><price></gold>.'
  payment-failed: '<prefix> <red>The payment failed. You were not charged.'
  seller-payment-failed: '<prefix> <red>The seller could not be paid, so the purchase was cancelled. You were refunded.'
  delayed: '<prefix> <yellow>Your payment went through, but finishing the purchase is delayed. The item will be delivered to <white>/ja claim</white> automatically; contact an admin if it does not arrive.'

cancel:
  success: '<prefix> <green>Listing cancelled: <white><amount>x <item></white> returned to you.'
  to-claim: '<prefix> <yellow>Your inventory is full. The item is waiting in <white>/ja claim</white>.'
  not-active: '<prefix> <red>That listing can no longer be cancelled (sold or already gone).'

  has-bids: '<prefix> <red>This auction already has bids and can no longer be cancelled.'

browse:
  own-listing: '<prefix> <yellow>That is your listing. Manage it with <white>/ja mylistings</white>.'

claim:
  empty: '<prefix> <gray>You have nothing to claim.'
  done: '<prefix> <green>Collected <white><count></white> item(s).'
  partial: '<prefix> <yellow>Collected <white><count></white> item(s). <white><remaining></white> more did not fit; make room and run <white>/ja claim</white> again.'
  one: '<prefix> <green>Item collected.'
  no-room: '<prefix> <red>Not enough room in your inventory.'

claims:
  join-notice: '<prefix> <yellow>You have <white><count></white> item(s) to collect: <white>/ja claim</white>'

expired:
  notice: '<prefix> <yellow><count> of your listings expired. Collect the items with <white>/ja claim</white>.'

history:
  empty: '<prefix> <gray>No sales or purchases yet.'
  header: '<prefix> <gold>Your last transactions:'
  sold: '<dark_gray><time> <green>SOLD <white><amount>x <item></white> to <white><other></white> for <gold><price></gold> (you got <earned>)'
  bought: '<dark_gray><time> <aqua>BOUGHT <white><amount>x <item></white> from <white><other></white> for <gold><price></gold>'

admin:
  reloaded: '<prefix> <green>Configuration and messages reloaded. (Storage settings and aliases need a restart.)'
  not-found: '<prefix> <red>No listing with id <id>.'
  not-active: '<prefix> <red>Listing <id> is not active (sold, expired, or being bought right now).'
  removed: '<prefix> <green>Listing #<id> of <seller> removed. The item is in their claim storage.'
  removed-notice: '<prefix> <yellow>An admin removed one of your listings. The item is waiting in <white>/ja claim</white>.'

update:
  available: '<prefix> <yellow>JustAuction <white><version></white> is available: <aqua><url></aqua>'

gui:
  browse:
    title: '<dark_gray>Auction House'
  mine:
    title: '<dark_gray>My listings'
  claims:
    title: '<dark_gray>Items to claim'
  confirm:
    title: '<dark_gray>Confirm purchase'
  listing-lore:
    - ''
    - '<!italic><gray>Price: <gold><price>'
    - '<!italic><gray>Seller: <white><seller>'
    - '<!italic><gray>Ends in: <white><time>'
    - ''
    - '<!italic><hint>'
  claim-lore:
    - ''
    - '<!italic><gray>Reason: <reason>'
    - ''
    - '<!italic><hint>'
  bid:
    title: '<dark_gray>Place a bid'
  auction-lore:
    - ''
    - '<!italic><gray>Auction #<id>  <dark_gray>|  <gray><bids> bid(s)'
    - '<!italic><gray>Top bid: <gold><bid> <gray>by <white><bidder>'
    - '<!italic><gray>Next bid: <gold><next>'
    - '<!italic><gray>Seller: <white><seller>'
    - '<!italic><gray>Ends in: <white><time>'
    - ''
    - '<!italic><hint>'
  auction-lore-nobid:
    - ''
    - '<!italic><gray>Auction #<id>  <dark_gray>|  <gray>no bids yet'
    - '<!italic><gray>Starting price: <gold><next>'
    - '<!italic><gray>Seller: <white><seller>'
    - '<!italic><gray>Ends in: <white><time>'
    - ''
    - '<!italic><hint>'
  auction-lore-buyout:
    - '<!italic><gray>Buyout: <gold><buyout>'
  hint:
    bid: '<yellow>Click to bid'
    own-auction: '<aqua>Your auction'
    cancel-auction: '<red>Click to cancel (no bids yet)'
    auction-has-bids: '<gray>Has bids, cannot be cancelled'
    bid-item: '<gray>Check the item and the bid'
    buy: '<yellow>Click to buy'
    own: '<aqua>Your listing'
    cancel: '<red>Click to cancel and take it back'
    claim: '<yellow>Click to collect'
    confirm-item: '<gray>Check the item and price'
  reason:
    PURCHASE: '<green>Purchase'
    EXPIRED: '<gold>Listing expired'
    CANCELLED: '<yellow>Listing cancelled'
    ADMIN_REMOVED: '<red>Removed by an admin'
    RETURNED: '<yellow>Returned'
  sort:
    NEWEST: 'Newest first'
    ENDING_SOON: 'Ending soon'
    PRICE_ASC: 'Price: low to high'
    PRICE_DESC: 'Price: high to low'
  button:
    prev: '<yellow>Previous page'
    prev-lore: []
    next: '<yellow>Next page'
    next-lore: []
    sort: '<gold>Sort'
    sort-lore:
      - '<!italic><gray>Now: <white><sort>'
      - '<!italic><yellow>Click to change'
    mine: '<gold>My listings'
    mine-lore:
      - '<!italic><gray>See and cancel your own listings'
    claims: '<gold>Items to claim'
    claims-lore:
      - '<!italic><gray>Waiting: <white><count>'
      - '<!italic><yellow>Click to open'
    page: '<white>Page <page>/<pages> <gray>(<total> listings)'
    search: '<gold>Search'
    search-lore:
      - '<!italic><gray>Use <white>/ja search <text></white>'
    search-active: '<red>Search: <white><search>'
    search-active-lore:
      - '<!italic><yellow>Click to clear the search'
    back: '<yellow>Back'
    back-lore: []
    confirm: '<green>Buy'
    confirm-lore:
      - '<!italic><gray>Pay <gold><price></gold> for <white><amount>x</white>'
    cancel: '<red>Cancel'
    cancel-lore: []
    collect-all: '<green>Collect all'
    collect-all-lore:
      - '<!italic><gray>Items waiting: <white><count>'
    place-bid: '<green>Bid <next>'
    place-bid-lore:
      - '<!italic><gray>Minimum next bid: <gold><next>'
      - '<!italic><gray>For a higher bid use <white>/ja bid <id> <amount>'
    buyout: '<gold>Buy it now for <buyout>'
    buyout-lore:
      - '<!italic><gray>Ends the auction immediately'

bid:
  success: '<prefix> <green>You are the top bidder on <white><amount>x <item></white> with <gold><bid></gold>. Auction #<id> ends in <white><time></white>.'
  too-low: '<prefix> <red>Your bid is too low. The minimum is <gold><next></gold>.'
  too-high: '<prefix> <red>The maximum price is <gold><max></gold>.'
  own-listing: '<prefix> <red>You cannot bid on your own auction.'
  already-highest: '<prefix> <yellow>You already hold the top bid on this auction.'
  not-available: '<prefix> <red>That auction is not available (ended, sold or cancelled).'
  insufficient-funds: '<prefix> <red>You cannot afford <gold><bid></gold>.'
  payment-failed: '<prefix> <red>The payment failed. You were not charged.'
  outbid-race: '<prefix> <yellow>Somebody bid at the same moment (or the auction just ended). You were not charged; try again.'
  no-buyout: '<prefix> <red>This auction has no buyout price.'
  blocked: '<prefix> <red>Another plugin prevented this bid.'
  not-an-auction: '<prefix> <red>Listing #<id> is not an auction. Use the auction house GUI to buy it.'
  usage: '<prefix> <red>Usage: <white>/ja bid <id> <amount></white>'
  outbid: '<prefix> <yellow>You were outbid on <white><amount>x <item></white> (auction #<id>). Your <gold><old></gold> was refunded. New top bid: <gold><bid></gold>.'
  new-bid: '<prefix> <green><bidder> bid <gold><bid></gold> on your <white><amount>x <item></white> (auction #<id>).'
  won: '<prefix> <green>You won <white><amount>x <item></white> for <gold><price></gold>!'
  won-to-claim: '<prefix> <yellow>Your inventory is full. The item is waiting for you: <white>/ja claim</white>.'
  sold: '<prefix> <green>Your auction #<id> ended: <buyer> won <white><amount>x <item></white> for <gold><price></gold>. You received <gold><earned></gold> (fee <fee>).'
  settle-failed: '<prefix> <red>Your auction #<id> could not be paid out, so it was cancelled. The winner was refunded and the item is in <white>/ja claim</white>.'
  winner-refunded: '<prefix> <yellow>Auction #<id> could not be finished, so your <gold><bid></gold> was refunded.'
  removed-refund: '<prefix> <yellow>An admin removed auction #<id>. Your bid of <gold><bid></gold> was refunded.'

broadcast:
  listed: '<prefix> <yellow><player></yellow> is selling <white><amount>x <item></white> for <gold><price></gold>. <aqua>/ah</aqua>'
  sold: '<prefix> <yellow><buyer></yellow> bought <white><amount>x <item></white> from <yellow><seller></yellow> for <gold><price></gold>.'
  auction-started: '<prefix> <yellow><player></yellow> started an auction: <white><amount>x <item></white>, bids from <gold><price></gold>. <aqua>/ah</aqua>'
  auction-bid: '<prefix> <yellow><bidder></yellow> bid <gold><bid></gold> on <white><amount>x <item></white> (auction #<id>).'
  auction-won: '<prefix> <yellow><winner></yellow> won <white><amount>x <item></white> from <yellow><seller></yellow> for <gold><price></gold>.'
