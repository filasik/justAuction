# ============================================================================
#  JustAuction configuration
#  Reload most values with /ja reload. Storage and command aliases need a restart.
# ============================================================================

# Config format version. Do not change: when you update the plugin, options that are new in the
# newer version are added to this file automatically (your values stay, a backup is saved first).
config-version: 3

# Language of all player-facing messages: en, cs.
# The files plugins/JustAuction/messages_<locale>.yml are yours to edit; missing keys fall back to the built-in text.
locale: en

# Check GitHub releases for a newer version (async, once at startup and then every 12 hours).
# Players with justauction.admin are told when they join.
update-check: true

command:
  # Extra aliases for /ja. Restart required. Remove an alias if another plugin already owns it.
  aliases:
    - auction
    - ah

# Anonymous usage statistics through bStats (server count, Minecraft version, storage type, ...).
# Set to false to switch them off for this plugin. The global switch is plugins/bStats/config.yml.
metrics: true

economy:
  # auto    = use VaultUnlocked's newer economy API when it is installed, else the classic Vault API
  # vault   = always the classic Vault API (works with Vault and VaultUnlocked)
  # vault2  = always the VaultUnlocked API (fails to start without VaultUnlocked)
  backend: auto

storage:
  # sqlite  = single file in the plugin folder, zero setup (default)
  # mariadb = MariaDB or MySQL server (use this to share data between servers)
  type: sqlite
  sqlite:
    file: justauction.db
    # Concurrent database connections (writes are serialized by SQLite anyway)
    pool-size: 3
  mariadb:
    host: localhost
    port: 3306
    database: justauction
    user: justauction
    password: change-me
    pool-size: 6
    # TLS mode of the connection. Leave empty for the driver default.
    # MySQL 8+ with a self-signed certificate (the default install) fails with
    # "Cannot use authentication plugin caching_sha2_password with a Self signed certificates":
    # use "trust" (encrypted, certificate not verified), or "disable" on a trusted local network.
    # Other values: verify-ca, verify-full (need a proper certificate).
    ssl-mode: ""

listing:
  # How long a listing stays on sale.
  duration-hours: 48
  # Price limits, in your economy's currency (up to 2 decimals).
  min-price: 1.00
  max-price: 1000000000.00
  # Percentage of the price the seller does NOT receive (the money is removed from the economy). 0 = off.
  sales-fee-percent: 5
  # Flat amount charged when creating a listing. Refunded if listing fails. 0 = off.
  listing-fee: 0
  # Expired / cancelled / unsold items wait in /ja claim for this many days, then they are deleted. 0 = keep forever.
  claim-retention-days: 7
  # Maximum simultaneous listings per player when no justauction.limit.<n> permission applies.
  # Permission example: justauction.limit.20 (the highest value a player has wins).
  default-max-listings: 5
  blacklist:
    # Items that cannot be listed (Bukkit material names).
    materials:
      - BEDROCK
      - BARRIER
      - LIGHT
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - COMMAND_BLOCK_MINECART
      - STRUCTURE_BLOCK
      - STRUCTURE_VOID
      - JIGSAW
      - DEBUG_STICK
      - KNOWLEDGE_BOOK
      - SPAWNER
      - TRIAL_SPAWNER
      - END_PORTAL_FRAME
      - REINFORCED_DEEPSLATE
    # Also reject containers (shulker boxes, bundles, ...) holding a blacklisted item.
    check-container-contents: true

auction:
  # Timed auctions with bidding: /ja auction <start price> [buyout price]. false = only fixed-price listings
  # (auctions that are already running still finish).
  enabled: true
  # How long an auction runs.
  duration-hours: 24
  # Every bid has to beat the current top bid by at least this many percent.
  min-increment-percent: 5
  # Anti-sniping: a bid placed in the last N seconds extends the auction so that N seconds remain. 0 = off.
  anti-snipe-seconds: 120

# Announce market activity in the chat of all online players. Everything is off by default.
# Players can opt out with the permission justauction.broadcast.receive (default: everybody).
# The texts are in messages_<locale>.yml under "broadcast".
broadcast:
  # Skip announcements for prices below this (stops spam from cheap items). 0 = announce everything.
  min-price: 0
  # A player puts an item on sale at a fixed price.
  listed: false
  # A fixed-price item was bought.
  sold: false
  # A player starts an auction.
  auction-started: false
  # Somebody placed a new top bid.
  auction-bid: false
  # An auction ended with a winner (or was bought out).
  auction-won: false

gui:
  # Minimum time between two clicks of the same player in a menu.
  click-cooldown-ms: 250
  # How often open menus reload their data from the database (20 ticks = 1 second).
  refresh-ticks: 100
  # Click / success / error sounds.
  sounds: true
