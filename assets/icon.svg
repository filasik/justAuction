<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="JustAuction icon">
  <title>JustAuction</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0f1f33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0a21a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#a86f3a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- sound block -->
  <rect x="44" y="196" width="168" height="26" rx="8" fill="url(#wood)"/>
  <!-- coin -->
  <circle cx="128" cy="158" r="50" fill="url(#gold)" stroke="#9a6a08" stroke-width="5"/>
  <circle cx="128" cy="158" r="36" fill="none" stroke="#9a6a08" stroke-width="3" opacity="0.6"/>
  <path d="M140 138v28a14 14 0 0 1-28 0" fill="none" stroke="#7a5206" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- gavel -->
  <g transform="rotate(-35 128 70)">
    <rect x="121" y="52" width="14" height="86" rx="6" fill="url(#wood)"/>
    <rect x="76" y="34" width="104" height="38" rx="12" fill="url(#wood)" stroke="#7a4a1c" stroke-width="4"/>
    <rect x="76" y="34" width="22" height="38" rx="9" fill="#7a4a1c" opacity="0.55"/>
    <rect x="158" y="34" width="22" height="38" rx="9" fill="#7a4a1c" opacity="0.55"/>
  </g>
</svg>
